name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check export_presets.cfg
        run: test -f export_presets.cfg
      - name: Setup templates, keystore & Java SDK
        run: |
          mkdir -p ~/.local/share/godot/keystores ~/.config/godot
          cp -rn /root/.local/share/godot/export_templates ~/.local/share/godot/
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/.local/share/godot/keystores/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          JAVA_PATH=$(dirname $(dirname $(readlink -f $(which javac))))
          ANDROID_SDK=${ANDROID_HOME:-/usr/lib/android-sdk}
          cat << EOF > ~/.config/godot/editor_settings-4.7.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_PATH"
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/debug_keystore = "$HOME/.local/share/godot/keystores/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Import project & Export APK
        run: |
          mkdir -p build/android
          godot --headless --import --quit
          godot --headless --export-debug "Android" build/android/game.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: build/android/game.apk
